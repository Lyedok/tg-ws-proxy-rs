name: Release

permissions:
    contents: write

on:
    push:
        tags:
            - v[0-9]+.*

jobs:
    create-release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: taiki-e/create-gh-release-action@v1
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

    upload-assets:
        needs: create-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: aarch64-unknown-linux-musl
                      os: ubuntu-latest
                    - target: aarch64-apple-darwin
                      os: macos-latest
                    - target: x86_64-unknown-linux-musl
                      os: ubuntu-latest
                    - target: mipsel-unknown-linux-musl
                      os: ubuntu-latest
                    - target: armv7-unknown-linux-musleabihf
                      os: ubuntu-latest
                    - target: x86_64-apple-darwin
                      os: macos-latest
                    - target: x86_64-pc-windows-gnu
                      os: windows-latest
                    - target: universal-apple-darwin
                      os: macos-latest
                    - target: mips-unknown-linux-musl
                      os: ubuntu-latest
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6

            # Default path (all targets except mipsel)
            - name: Build & upload (default)
              if: matrix.target != 'mipsel-unknown-linux-musl' && matrix.target != 'mips-unknown-linux-musl'
              uses: taiki-e/upload-rust-binary-action@v1
              with:
                  bin: tg-ws-proxy
                  target: ${{ matrix.target }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            # Special path for mipsel: nightly + build-std, then upload via gh cli
            - name: Install nightly + rust-src (mipsel and mips)
              if: matrix.target == 'mipsel-unknown-linux-musl' || matrix.target == 'mips-unknown-linux-musl'
              uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rust-src

            - name: Install cross (mipsel and mips)
              if: matrix.target == 'mipsel-unknown-linux-musl' || matrix.target == 'mips-unknown-linux-musl'
              run: cargo install cross --locked

            # `+crt-static` is not the default on the mips musl targets the way it
            # is on every other musl target we ship, so without it these two come
            # out dynamically linked against /lib/ld-musl-mips*-sf.so.1 — which
            # contradicts the static binary the docs promise, and breaks outright
            # if the device's musl variant does not match. Set through --config
            # rather than RUSTFLAGS so it does not depend on `cross` forwarding
            # env vars into the container, and applied to std as well via build-std.
            - name: Build (mipsel, build-std)
              if: matrix.target == 'mipsel-unknown-linux-musl'
              run: |
                  cross +nightly build --release --bin tg-ws-proxy \
                      --target mipsel-unknown-linux-musl -Z build-std=std,panic_abort \
                      --config 'target.mipsel-unknown-linux-musl.rustflags=["-C","target-feature=+crt-static"]'

            - name: Build (mips, build-std)
              if: matrix.target == 'mips-unknown-linux-musl'
              run: |
                  cross +nightly build --release --bin tg-ws-proxy \
                      --target mips-unknown-linux-musl -Z build-std=std,panic_abort \
                      --config 'target.mips-unknown-linux-musl.rustflags=["-C","target-feature=+crt-static"]'

            - name: Inspect build output (mips variants)
              if: matrix.target == 'mipsel-unknown-linux-musl' || matrix.target == 'mips-unknown-linux-musl'
              run: |
                  FILE="target/${{ matrix.target }}/release/tg-ws-proxy"
                  ls -lah "target/${{ matrix.target }}/release/" || true
                  test -f "$FILE"

                  # Fail loudly rather than shipping a binary that needs a musl
                  # loader on the device. A dynamic build still runs on OpenWrt,
                  # so nothing downstream would have caught this.
                  file "$FILE"
                  if readelf -d "$FILE" | grep -q NEEDED; then
                      echo "::error::$FILE is dynamically linked; expected a static binary"
                      exit 1
                  fi

            - name: Upload to GitHub Release (mips variants)
              if: matrix.target == 'mipsel-unknown-linux-musl' || matrix.target == 'mips-unknown-linux-musl'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euxo pipefail
                  TAG="${GITHUB_REF_NAME}"
                  NAME="tg-ws-proxy-${{ matrix.target }}"
                  TMPDIR="$(mktemp -d)"
                  cp "target/${{ matrix.target }}/release/tg-ws-proxy" "${TMPDIR}/tg-ws-proxy"
                  tar -C "${TMPDIR}" -czf "${NAME}.tar.gz" tg-ws-proxy
                  gh release upload "$TAG" "${NAME}.tar.gz" --clobber

    # Extra UPX-packed assets for flash-constrained devices (OpenWrt routers).
    #
    # These do not replace the plain assets: packing trades RAM for flash. A
    # normal ELF maps its text from the file, so only the working set is
    # resident and those pages can be evicted under pressure; the UPX stub
    # decompresses the whole image into anonymous memory instead, which on a
    # router with no swap stays resident for the life of the process. Good deal
    # on a 128 MB device with 8 MB of flash, bad one on a 32 MB device — so the
    # choice belongs to whoever is doing the flashing.
    #
    # Windows and macOS are deliberately excluded: UPX-packed PE files trip
    # antivirus heuristics, which is unacceptable for a censorship-circumvention
    # tool, and packing a Mach-O invalidates its signature so arm64 macOS
    # refuses to run it at all.
    compress-assets:
        needs: upload-assets
        # Not `success()`: upload-assets covers Windows and macOS too, and a
        # hiccup there should not silently drop every `-upx` asset. Each leg
        # below fails on its own if its plain asset never made it to the release.
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: mipsel-unknown-linux-musl
                      qemu: qemu-mipsel-static
                    - target: mips-unknown-linux-musl
                      qemu: qemu-mips-static
                    - target: armv7-unknown-linux-musleabihf
                      qemu: qemu-arm-static
                    - target: aarch64-unknown-linux-musl
                      qemu: qemu-aarch64-static
                    - target: x86_64-unknown-linux-musl
                      qemu: qemu-x86_64-static
        steps:
            - name: Install UPX and qemu-user-static
              env:
                  UPX_VERSION: 5.2.0
                  UPX_SHA256: 3db5d3294707439db97866feab8d75d800f028f48481a40547411824da4288a1
              shell: bash
              run: |
                  set -euxo pipefail
                  curl -fsSL -o upx.tar.xz \
                      "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
                  echo "${UPX_SHA256}  upx.tar.xz" | sha256sum -c -
                  tar -xJf upx.tar.xz
                  sudo install -m 0755 "upx-${UPX_VERSION}-amd64_linux/upx" /usr/local/bin/upx
                  sudo apt-get update
                  sudo apt-get install -y qemu-user-static

            - name: Pack, verify and upload
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euxo pipefail
                  TAG="${GITHUB_REF_NAME}"
                  NAME="tg-ws-proxy-${{ matrix.target }}"
                  WORK="$(mktemp -d)"

                  gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" \
                      --pattern "${NAME}.tar.gz" --dir "$WORK"
                  tar -C "$WORK" -xzf "${WORK}/${NAME}.tar.gz"
                  test -f "${WORK}/tg-ws-proxy"

                  # Smoke-test the stock binary first. If this fails the emulator
                  # is the problem, not UPX, and the post-pack check below would
                  # be measuring nothing.
                  ${{ matrix.qemu }} "${WORK}/tg-ws-proxy" --help > "${WORK}/help-plain.txt"
                  grep -q "Usage: tg-ws-proxy" "${WORK}/help-plain.txt"
                  BEFORE="$(stat -c %s "${WORK}/tg-ws-proxy")"

                  upx -9 --lzma "${WORK}/tg-ws-proxy"
                  upx -t "${WORK}/tg-ws-proxy"

                  # `upx -t` only proves the payload round-trips. The failure that
                  # actually reaches users is a stub that packs clean and then dies
                  # on the target ABI, so run the packed binary for real.
                  ${{ matrix.qemu }} "${WORK}/tg-ws-proxy" --help > "${WORK}/help-packed.txt"
                  grep -q "Usage: tg-ws-proxy" "${WORK}/help-packed.txt"
                  AFTER="$(stat -c %s "${WORK}/tg-ws-proxy")"
                  echo "${{ matrix.target }}: ${BEFORE} -> ${AFTER} bytes on flash"

                  tar -C "$WORK" -czf "${NAME}-upx.tar.gz" tg-ws-proxy
                  gh release upload "$TAG" "${NAME}-upx.tar.gz" \
                      --repo "${GITHUB_REPOSITORY}" --clobber
